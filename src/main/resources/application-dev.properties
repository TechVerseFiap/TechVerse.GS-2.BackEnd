# Perfil dev: banco H2 em memória, não precisa do Oracle
spring.datasource.url=jdbc:h2:mem:cidadaofacil;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration/h2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# No H2 em memória o catálogo começaria vazio a cada subida: sincronize pelo painel ou pelo POST /api/sincronizacao
govbr.sincronizar-ao-iniciar=false

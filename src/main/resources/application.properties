spring.application.name=cidadao-facil-api

# Porta (o Render define pela variável PORT)
server.port=${PORT:8080}

# Banco Oracle da FIAP (credenciais por variável de ambiente)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Poucas conexões: o servidor da FIAP limita sessões
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Tabelas criadas pelo Flyway (scripts de Database); o Hibernate só usa o mapeamento
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Carrega relacionamentos em lote (menos idas ao banco, que fica longe do servidor)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway: V1 cria as 14 tabelas e as sequências, V2 carrega o catálogo e o panorama
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Swagger e erros sem stacktrace
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

server.error.include-stacktrace=never

# Gravação em lote (sincronização com a Base dos Dados insere milhares de linhas)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Base dos Dados (BigQuery): JSON da conta de serviço do Google Cloud, nunca no código
basedosdados.credenciais=${BASEDOSDADOS_CREDENTIALS:}
# Projeto do Google Cloud que paga a consulta (vazio = project_id do JSON)
basedosdados.projeto-cobranca=${BASEDOSDADOS_BILLING_PROJECT:}
# UF dos municípios do panorama (o modelo de Database foi carregado com SP)
basedosdados.uf=${BASEDOSDADOS_UF:SP}
# Ao subir, atualiza sozinho se a última consulta tiver mais de N dias
basedosdados.sincronizar-ao-iniciar=${BASEDOSDADOS_SYNC_ON_STARTUP:true}
basedosdados.dias-validade=${BASEDOSDADOS_MAX_AGE_DAYS:7}

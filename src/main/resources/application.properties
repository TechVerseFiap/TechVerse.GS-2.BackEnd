spring.application.name=cidadao-facil-api

# Porta (o Render define pela variável PORT)
server.port=${PORT:8080}

# Banco Oracle da FIAP (credenciais por variável de ambiente)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Poucas conexões: o servidor da FIAP limita sessões
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate: "update" cria as tabelas T_CF_*
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Carga dos dados demonstrativos
app.seed.enabled=${SEED_ENABLED:true}

# Swagger e erros sem stacktrace
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

server.error.include-stacktrace=never
